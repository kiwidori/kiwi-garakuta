name: Release Kiwi Diff

on:
  push:
    tags:
      - kiwi-diff-v*

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependency
        run: python -m pip install pyinstaller==6.22.2
      - name: Build portable ZIP from verified upstream binary
        run: python apps/kiwi-diff/build.py
      - name: Check ZIP contents
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from zipfile import ZipFile
          package = Path('apps/kiwi-diff/KiwiDiff-0.2.0-win11-x64.zip')
          with ZipFile(package) as archive:
              needed = {'KiwiDiff.exe', 'README.txt', 'LICENSE', 'difftastic-LICENSE', 'difftastic-README.md', 'THIRD-PARTY-NOTICES.txt', 'Runtime-LICENSES.txt'}
              assert needed <= set(archive.namelist())
          print('ZIP contents OK')
          '@ | python -
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" "apps/kiwi-diff/KiwiDiff-0.2.0-win11-x64.zip" --title "きうい比較 0.2.0" --notes "Windows 11 x64向けの無料ZIP版。difftasticでUTF-8のテキスト・コードを比較できます。上流ライセンス文書を同梱しています。"
