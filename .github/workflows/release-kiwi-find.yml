name: Release Kiwi Find

on:
  push:
    tags:
      - kiwi-find-v*

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install build dependency
        run: python -m pip install pyinstaller==6.22.2
      - name: Build portable ZIP from verified upstream archive
        run: python apps/kiwi-find/build.py
      - name: Check ZIP contents
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from zipfile import ZipFile
          package = Path('apps/kiwi-find/KiwiFind-0.2.0-win11-x64.zip')
          with ZipFile(package) as archive:
              needed = {'KiwiFind.exe', 'README.txt', 'LICENSE', 'fd-LICENSE-MIT', 'fd-LICENSE-APACHE'}
              assert needed <= set(archive.namelist())
          print('ZIP contents OK')
          '@ | python -
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" "apps/kiwi-find/KiwiFind-0.2.0-win11-x64.zip" --title "きういファイル探し 0.2.0" --notes "Windows 11 x64向けの無料ZIP版。fdのファイル名検索GUIです。ライセンス文書を同梱しています。"
