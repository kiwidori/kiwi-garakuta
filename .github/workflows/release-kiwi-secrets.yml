name: Release Kiwi Secrets

on:
  push:
    tags:
      - kiwi-secrets-v*

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependency
        run: python -m pip install pyinstaller==6.22.2
      - name: Build portable ZIP from verified upstream binary
        run: python apps/kiwi-secrets/build.py
      - name: Check ZIP contents
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from zipfile import ZipFile
          package = Path('apps/kiwi-secrets/KiwiSecrets-0.2.1-win11-x64.zip')
          with ZipFile(package) as archive:
              needed = {'KiwiSecrets.exe', 'README.txt', 'LICENSE', 'gitleaks-LICENSE', 'gitleaks-README.md'}
              assert needed <= set(archive.namelist())
          print('ZIP contents OK')
          '@ | python -
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'Release already exists; keeping verified asset.'
            exit 0
          }
          gh release create "${{ github.ref_name }}" "apps/kiwi-secrets/KiwiSecrets-0.2.1-win11-x64.zip" --title "きうい秘密チェック 0.2.1" --notes "Windows 11 x64向けの無料ZIP版。Gitleaksを使ってフォルダー内の機密情報候補をチェックできます。上流ライセンス文書を同梱しています。"
