name: Release Kiwi HTTP

on:
  push:
    tags:
      - kiwi-http-v*

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependency
        run: python -m pip install pyinstaller==6.22.2
      - name: Build portable ZIP from verified upstream binary
        run: python apps/kiwi-http/build.py
      - name: Check ZIP contents
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from zipfile import ZipFile
          package = Path('apps/kiwi-http/KiwiHTTP-0.2.0-win11-x64.zip')
          with ZipFile(package) as archive:
              needed = {'KiwiHTTP.exe', 'README.txt', 'LICENSE', 'xh-LICENSE', 'xh-README.md'}
              assert needed <= set(archive.namelist())
          print('ZIP contents OK')
          '@ | python -
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" "apps/kiwi-http/KiwiHTTP-0.2.0-win11-x64.zip" --title "きういHTTPビュー 0.2.0" --notes "Windows 11 x64向けの無料ZIP版。xhを使ってHTTP応答をテキストで確認できます。上流ライセンス文書を同梱しています。"
